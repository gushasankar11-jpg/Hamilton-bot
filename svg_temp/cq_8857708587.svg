<svg width='200' height='120' xmlns='http://www.w3.org/2000/svg'>
  <!-- Propagation direction -->
  <line x1='20' y1='60' x2='180' y2='60' stroke='black' stroke-width='2' marker-end='url(#arrow)'/>
  <defs>
    <marker id='arrow' markerWidth='10' markerHeight='7' refX='0' refY='3.5' orient='auto'>
      <polygon points='0 0, 10 3.5, 0 7' fill='black'/>
    </marker>
  </defs>
  <!-- Absorbing surface -->
  <rect x='150' y='30' width='5' height='60' fill='gray'/> 
  <text x='155' y='55' font-size='12' fill='black'>Surface</text>
  <!-- Wave label -->
  <text x='80' y='45' font-size='12' fill='black'>E field (ŷ)</text>
</svg>