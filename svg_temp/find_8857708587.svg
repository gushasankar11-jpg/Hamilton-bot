<svg xmlns="http://www.w3.org/2000/svg" width="800" height="365" viewBox="0 0 800 365"><rect width="800" height="365" fill="#0a0a1a" rx="15"/><text x="400" y="42" font-size="22" font-weight="bold" fill="#ffffff" font-family="Arial" text-anchor="middle">OVERALL PROGRESS</text><text x="40" y="100" font-size="16" fill="#cccccc" font-family="Arial">Overall</text><rect x="40" y="110" width="600" height="28" fill="#222" rx="14"/><rect x="40" y="110" width="27" height="28" fill="#dc3545" rx="14"/><text x="660" y="132" font-size="20" font-weight="bold" fill="#dc3545" font-family="Arial">4.5</text><text x="40" y="175" font-size="14" fill="#888888" font-family="Arial">SUBJECT-WISE</text><text x="40" y="204" font-size="14" fill="#dddddd" font-family="Arial">Maths</text><rect x="40" y="212" width="600" height="22" fill="#222" rx="11"/><rect x="40" y="212" width="27" height="22" fill="#dc3545" rx="11"/><text x="660" y="230" font-size="15" font-weight="bold" fill="#dc3545" font-family="Arial">4.5</text><text x="40" y="259" font-size="14" fill="#dddddd" font-family="Arial">Physics</text><rect x="40" y="267" width="600" height="22" fill="#222" rx="11"/><rect x="40" y="267" width="0" height="22" fill="#444444" rx="11"/><text x="660" y="285" font-size="15" font-weight="bold" fill="#444444" font-family="Arial">—</text><text x="40" y="314" font-size="14" fill="#dddddd" font-family="Arial">Chemistry</text><rect x="40" y="322" width="600" height="22" fill="#222" rx="11"/><rect x="40" y="322" width="0" height="22" fill="#444444" rx="11"/><text x="660" y="340" font-size="15" font-weight="bold" fill="#444444" font-family="Arial">—</text><g transform="translate(720,10) scale(0.35)" opacity="0.9">
  <defs>
