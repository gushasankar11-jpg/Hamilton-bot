<svg width='200' height='150' xmlns='http://www.w3.org/2000/svg'>
  <!-- capacitor plates -->
  <rect x='30' y='30' width='140' height='10' fill='gray'/>
  <rect x='30' y='110' width='140' height='10' fill='gray'/>
  <!-- loop -->
  <circle cx='100' cy='70' r='40' stroke='blue' stroke-width='2' fill='none'/>
  <!-- arrows for B -->
  <path d='M100,30 A40,40 0 0,1 140,70' stroke='red' stroke-width='2' fill='none' marker-end='url(#arrow)'/>
  <defs>
    <marker id='arrow' markerWidth='6' markerHeight='6' refX='0' refY='3' orient='auto'>
      <path d='M0,0 L0,6 L6,3 z' fill='red'/>
    </marker>
  </defs>
  <!-- labels -->
  <text x='100' y='20' font-size='12' text-anchor='middle'>Plate</text>
  <text x='100' y='140' font-size='12' text-anchor='middle'>Plate</text>
  <text x='150' y='70' font-size='12' fill='blue'>r</text>
</svg>