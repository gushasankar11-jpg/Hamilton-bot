<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg" style="background:#0a0a1a">
  <!-- Straight wire -->
  <line x1="50" y1="20" x2="50" y2="180" stroke="#ffffff" stroke-width="2"/>
  <text x="55" y="100" fill="#ffffff" font-size="12">I ↑</text>
  <!-- Magnetic field circles around wire -->
  <circle cx="50" cy="100" r="30" stroke="#00ff00" stroke-width="1" fill="none"/>
  <circle cx="50" cy="100" r="45" stroke="#00ff00" stroke-width="1" fill="none"/>
  <circle cx="50" cy="100" r="60" stroke="#00ff00" stroke-width="1" fill="none"/>
  <!-- Arrow heads on circles -->
  <polygon points="115,100 110,95 110,105" fill="#00ff00"/>
  <polygon points="100,140 95,135 95,145" fill="#00ff00"/>
  <polygon points="80,165 75,160 75,170" fill="#00ff00"/>
  <!-- Solenoid -->
  <rect x="180" y="40" width="10" height="120" fill="#ffffff"/>
  <rect x="210" y="40" width="10" height="120" fill="#ffffff"/>
  <line x1="190" y1="40" x2="190" y2="160" stroke="#ffffff" stroke-width="2"/>
  <line x1="220" y1="40" x2="220" y2="160" stroke="#ffffff" stroke-width="2"/>
  <!-- Loops -->
  <path d="M190,60 q15,-10 30,0" stroke="#ff9900" fill="none" stroke-width="2"/>
  <path d="M190,80 q15,-10 30,0" stroke="#ff9900" fill="none" stroke-width="2"/>
  <path d="M190,100 q15,-10 30,0" stroke="#ff9900" fill="none" stroke-width="2"/>
  <path d="M190,120 q15,-10 30,0" stroke="#ff9900" fill="none" stroke-width="2"/>
  <path d="M190,140 q15,-10 30,0" stroke="#ff9900" fill="none" stroke-width="2"/>
  <!-- B field inside solenoid -->
  <line x1="205" y1="50" x2="205" y2="150" stroke="#00ffff" stroke-width="2"/>
  <polygon points="205,45 200,50 210,50" fill="#00ffff"/>
  <text x="230" y="100" fill="#ffffff" font-size="12">B (inside)</text>
<g transform="translate(220,10) scale(0.35)" opacity="0.9">
  <defs>
    <style>
      .g { fill: #c9a961; }
      .g-line { stroke: #c9a961; fill: none; }
    </style>
  </defs>

  <g class="g">
    <ellipse cx="30" cy="70" rx="7" ry="3" transform="rotate(-45 30 70)"/>
    <ellipse cx="26" cy="82" rx="8" ry="3" transform="rotate(-30 26 82)"/>
    <ellipse cx="24" cy="96" rx="9" ry="3.2" transform="rotate(-15 24 96)"/>
    <ellipse cx="24" cy="110" rx="9" ry="3.2"/>
    <ellipse cx="26" cy="124" rx="9" ry="3.2" transform="rotate(15 26 124)"/>
    <ellipse cx="32" cy="138" rx="8" ry="3" transform="rotate(30 32 138)"/>
    <ellipse cx="40" cy="150" rx="7" ry="3" transform="rotate(45 40 150)"/>
    <ellipse cx="52" cy="160" rx="6" ry="2.8" transform="rotate(60 52 160)"/>

    <ellipse cx="170" cy="70" rx="7" ry="3" transform="rotate(45 170 70)"/>
    <ellipse cx="174" cy="82" rx="8" ry="3" transform="rotate(30 174 82)"/>
    <ellipse cx="176" cy="96" rx="9" ry="3.2" transform="rotate(15 176 96)"/>
    <ellipse cx="176" cy="110" rx="9" ry="3.2"/>
    <ellipse cx="174" cy="124" rx="9" ry="3.2" transform="rotate(-15 174 124)"/>
    <ellipse cx="168" cy="138" rx="8" ry="3" transform="rotate(-30 168 138)"/>
    <ellipse cx="160" cy="150" rx="7" ry="3" transform="rotate(-45 160 150)"/>
    <ellipse cx="148" cy="160" rx="6" ry="2.8" transform="rotate(-60 148 160)"/>
  </g>

  <path d="M 100,40 L 145,55 L 145,110 Q 145,140 100,160 Q 55,140 55,110 L 55,55 Z"
        class="g-line" stroke-width="3"/>

  <text x="72" y="105" font-family="Georgia, serif" font-weight="bold"
        font-size="34" class="g">H</text>
  <text x="112" y="105" font-family="Georgia, serif" font-weight="bold"
        font-size="34" class="g">K</text>

  <g transform="translate(68, 115)">
    <path d="M 0,0 Q 8,-3 16,0 L 16,14 Q 8,11 0,14 Z" class="g-line" stroke-width="2"/>
    <line x1="8" y1="0" x2="8" y2="14" class="g-line" stroke-width="1.5"/>
  </g>

  <g transform="translate(118, 60)">
    <path d="M 0,20 Q 5,5 18,0 Q 20,15 8,22 Z" class="g"/>
    <line x1="0" y1="20" x2="8" y2="18" class="g-line" stroke-width="1.5"/>
  </g>
</g></svg>