<svg xmlns="http://www.w3.org/2000/svg" width="800" height="356" viewBox="0 0 800 120"><rect width="100%" height="100%" fill="#0a0a1a"/><text x="15" y="288" font-size="256" font-family="serif" fill="#ffffff">[</text><text x="335" y="288" font-size="256" font-family="serif" fill="#ffffff">]</text><text x="60" y="64" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\textbf{Wave Type}</text><text x="120" y="64" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\textbf{Wavelength Range } (\lambda)</text><text x="180" y="64" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\textbf{Frequency Range } (\nu)</text><text x="240" y="64" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\textbf{Production}</text><text x="300" y="64" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\textbf{Detection}</text><text x="60" y="96" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\text{Radio Waves}</text><text x="120" y="96" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">&gt; 0.1\text{ m}</text><text x="180" y="96" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">&lt; 3 × 10^9\text{ Hz}</text><text x="240" y="96" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\text{Accelerated charges in antennas, LC circuits}</text><text x="300" y="96" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\text{Receiver aerials, resonant LC circuits}</text><text x="60" y="128" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\text{Microwaves}</text><text x="120" y="128" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">0.1\text{ m to } 1\text{ mm}</text><text x="180" y="128" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">3 × 10^9\text{ to } 3 × 10^{11}\text{ Hz}</text><text x="240" y="128" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\text{Klystrons, Magnetrons, Gunn diodes}</text><text x="300" y="128" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\text{Point-contact diodes, bolometers}</text><text x="60" y="160" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\text{Infrared (IR)}</text><text x="120" y="160" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">1\text{ mm to } 700\text{ nm}</text><text x="180" y="160" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">3 × 10^{11}\text{ to } 4 × 10^{14}\text{ Hz}</text><text x="240" y="160" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\text{Thermal vibrations of atoms/molecules}</text><text x="300" y="160" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\text{Thermopiles, Bolometers, Infrared film}</text><text x="60" y="192" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\text{Visible Light}</text><text x="120" y="192" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">700\text{ nm to } 400\text{ nm}</text><text x="180" y="192" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">4 × 10^{14}\text{ to } 7.5 × 10^{14}\text{ Hz}</text><text x="240" y="192" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\text{Valence electron transitions in atoms}</text><text x="300" y="192" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\text{Eye, Photocells, Photographic plates}</text><text x="60" y="224" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\text{Ultraviolet (UV)}</text><text x="120" y="224" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">400\text{ nm to } 1\text{ nm}</text><text x="180" y="224" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">7.5 × 10^{14}\text{ to } 3 × 10^{17}\text{ Hz}</text><text x="240" y="224" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\text{Inner shell transitions, mercury arc lamps}</text><text x="300" y="224" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\text{Photocells, fluorescent screens}</text><text x="60" y="256" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\text{X-rays}</text><text x="120" y="256" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">1\text{ nm to } 10^{-3}\text{ nm}</text><text x="180" y="256" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">3 × 10^{17}\text{ to } 3 × 10^{20}\text{ Hz}</text><text x="240" y="256" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\text{Bombarding heavy target with fast } e^-</text><text x="300" y="256" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\text{Photographic film, Geiger counters, ionization chambers}</text><text x="60" y="288" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\gamma\text{-rays}</text><text x="120" y="288" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">&lt; 10^{-3}\text{ nm}</text><text x="180" y="288" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">&gt; 3 × 10^{20}\text{ Hz}</text><text x="240" y="288" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\text{Nuclear decays, nuclear reactions}</text><text x="300" y="288" text-anchor="middle" font-size="18" font-family="Arial" fill="#ffffff">\text{Geiger-Müller counter, Scintillation counter}</text><text x="30" y="32" font-size="14" font-family="Arial" fill="#cccccc">$$</text><g transform="translate(720,10) scale(0.35)" opacity="0.9">
  <defs>
    <style>
      .g { fill: #c9a961; }
      .g-line { stroke: #c9a961; fill: none; }
      .g-fill { fill: #c9a961; }
    </style>
  </defs>

  <!-- LEFT LAUREL BRANCH -->
  <g class="g-fill">
    <ellipse cx="26" cy="66" rx="8" ry="3.5" transform="rotate(-50 26 66)"/>
    <ellipse cx="22" cy="80" rx="9" ry="3.5" transform="rotate(-35 22 80)"/>
    <ellipse cx="19" cy="95" rx="10" ry="3.5" transform="rotate(-20 19 95)"/>
    <ellipse cx="18" cy="110" rx="10" ry="3.5"/>
    <ellipse cx="20" cy="125" rx="10" ry="3.5" transform="rotate(20 20 125)"/>
    <ellipse cx="24" cy="139" rx="9" ry="3.5" transform="rotate(35 24 139)"/>
    <ellipse cx="31" cy="152" rx="8" ry="3.5" transform="rotate(50 31 152)"/>
    <ellipse cx="42" cy="163" rx="7" ry="3" transform="rotate(65 42 163)"/>
    <ellipse cx="55" cy="171" rx="6" ry="2.8" transform="rotate(80 55 171)"/>
  </g>

  <!-- RIGHT LAUREL BRANCH -->
  <g class="g-fill">
    <ellipse cx="174" cy="66" rx="8" ry="3.5" transform="rotate(50 174 66)"/>
    <ellipse cx="178" cy="80" rx="9" ry="3.5" transform="rotate(35 178 80)"/>
    <ellipse cx="181" cy="95" rx="10" ry="3.5" transform="rotate(20 181 95)"/>
    <ellipse cx="182" cy="110" rx="10" ry="3.5"/>
    <ellipse cx="180" cy="125" rx="10" ry="3.5" transform="rotate(-20 180 125)"/>
    <ellipse cx="176" cy="139" rx="9" ry="3.5" transform="rotate(-35 176 139)"/>
    <ellipse cx="169" cy="152" rx="8" ry="3.5" transform="rotate(-50 169 152)"/>
    <ellipse cx="158" cy="163" rx="7" ry="3" transform="rotate(-65 158 163)"/>
    <ellipse cx="145" cy="171" rx="6" ry="2.8" transform="rotate(-80 145 171)"/>
  </g>

  <!-- SHIELD -->
  <path d="M 100,42 L 148,58 L 148,115 Q 148,148 100,168 Q 52,148 52,115 L 52,58 Z"
        class="g-line" stroke-width="3.5"/>

  <!-- H (left) -->
  <text x="70" y="110" font-family="Georgia, 'Times New Roman', serif"
        font-weight="bold" font-size="42" class="g-fill">H</text>
  <!-- Vertical bar between -->
  <rect x="98" y="72" width="3" height="60" class="g-fill"/>
  <!-- K (right) -->
  <text x="108" y="110" font-family="Georgia, 'Times New Roman', serif"
        font-weight="bold" font-size="42" class="g-fill">K</text>

  <!-- BOOK (bottom left of shield) -->
  <g transform="translate(62, 118)">
    <path d="M 0,0 Q 9,-4 18,0 L 18,15 Q 9,11 0,15 Z" class="g-line" stroke-width="2"/>
    <line x1="9" y1="0" x2="9" y2="15" class="g-line" stroke-width="1.6"/>
  </g>

  <!-- LEAF/QUILL (top right of shield) -->
  <g transform="translate(120, 68)">
    <path d="M 0,22 Q 6,6 20,0 Q 22,16 8,24 Z" class="g-fill"/>
    <path d="M 2,20 Q 8,12 16,6" class="g-line" stroke-width="1.5"/>
  </g>
</g></svg>